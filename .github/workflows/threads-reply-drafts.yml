name: Threads reply drafts

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "답글 달 글을 찾을 키워드 (예: 신년 말씀)"
        required: true
      count:
        description: "초안 개수 (최대 10)"
        default: "3"
      allow_own:
        description: "내 글에도 이어쓰기 답글 초안 만들기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: threads-queue
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Search, read conversations, and draft replies
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEYWORD: ${{ inputs.keyword }}
          COUNT: ${{ inputs.count }}
          ALLOW_OWN: ${{ inputs.allow_own }}
        run: node scripts/threads-reply-drafts.mjs

      - name: Save queue
        run: |
          if ! git diff --quiet posts/queue.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add Threads reply drafts" posts/queue.json
            git pull --rebase
            git push
          fi
