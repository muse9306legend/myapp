name: Threads keyword search

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "검색할 키워드 (예: 스하리, 신년 말씀)"
        required: true
      search_type:
        description: "정렬"
        type: choice
        options: [TOP, RECENT]
        default: TOP
      limit:
        description: "가져올 개수 (최대 100)"
        default: "25"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Search Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          KEYWORD: ${{ inputs.keyword }}
          SEARCH_TYPE: ${{ inputs.search_type }}
          LIMIT: ${{ inputs.limit }}
          SAVE_DIR: research/threads-search
        run: node scripts/threads-search.mjs

      - name: Save results to the repository
        run: |
          git add research/threads-search
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Save Threads search results"
            git pull --rebase
            git push
          fi
