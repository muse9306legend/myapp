name: Threads AI writer

on:
  schedule:
    - cron: "17 13 * * *" # 22:17 KST, writes tomorrow's posts
  workflow_dispatch:
    inputs:
      date:
        description: "글을 쓸 날짜 (YYYY-MM-DD, 비우면 내일)"
        required: false
      topic:
        description: "이번에 다룰 주제 힌트 (선택)"
        required: false

permissions:
  contents: write

concurrency:
  group: threads-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write posts with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_DATE: ${{ inputs.date }}
          TOPIC: ${{ inputs.topic }}
        run: node scripts/threads-generate.mjs

      - name: Save queue
        run: |
          if ! git diff --quiet posts/queue.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add AI-written Threads posts" posts/queue.json
            git pull --rebase
            git push
          fi
