name: Threads scheduled post

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제로 게시하지 않고 확인만"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: threads-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Telegram – read approvals and edits
        if: vars.TELEGRAM_ENABLED == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MODE: sync
        run: node scripts/telegram-sync.mjs

      - name: Publish due posts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/threads-post.mjs

      - name: Telegram – send new drafts and results
        if: always() && vars.TELEGRAM_ENABLED == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: notify
        run: node scripts/telegram-sync.mjs

      - name: Save queue status
        if: always()
        run: |
          if ! git diff --quiet posts/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts/queue.json posts/telegram-state.json
            git commit -m "Update Threads queue status"
            git pull --rebase
            git push
          fi
