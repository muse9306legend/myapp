<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>쓰레드 자동화</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-512.png" />
  <link rel="apple-touch-icon" href="./icon-maskable.png" />
  <meta name="theme-color" content="#101010" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    :root {
      --bg: #f5f5f5; --panel: #fff; --ink: #101010; --muted: #6b6b6b; --line: #e2e2e2;
      --accent: #101010; --accent-ink: #fff; --ok: #12805c; --warn: #b26b00; --bad: #c4314b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0b; --panel: #181818; --ink: #f2f2f2; --muted: #9a9a9a; --line: #2c2c2c;
        --accent: #f2f2f2; --accent-ink: #101010; --ok: #4cc99a; --warn: #f0b44c; --bad: #ff7a90;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    button, input, textarea { font: inherit; color: inherit; }
    .app { width: min(720px, 100%); margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    header img { width: 44px; height: 44px; border-radius: 10px; }
    h1 { margin: 0; font-size: 24px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    textarea { width: 100%; min-height: 140px; resize: vertical; padding: 12px; border: 1px solid var(--line);
      border-radius: 10px; background: transparent; line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
    input[type="datetime-local"] { padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; }
    .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .count.over { color: var(--bad); font-weight: 700; }
    .btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    pre { margin: 10px 0 0; padding: 12px; border-radius: 10px; background: var(--bg); overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .hint a { color: inherit; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 13px; }
    .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 12px 0; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .badge { padding: 2px 8px; border-radius: 999px; font-weight: 700; border: 1px solid currentColor; }
    .draft { color: var(--muted); } .pending { color: var(--warn); } .published { color: var(--ok); } .failed { color: var(--bad); }
    .text { white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
    .err { color: var(--bad); font-size: 12px; margin-top: 4px; }
    .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <img src="./icon-512.png" alt="" />
      <div>
        <h1>쓰레드 자동화</h1>
        <p>Claude가 매일 밤 다음 날 글을 초안으로 써 두고, 대기로 바꾼 글은 예약 시간에 자동 게시돼요.</p>
      </div>
    </header>

    <section class="card">
      <h2>새 글 예약</h2>
      <textarea id="text" placeholder="Threads에 올릴 글을 입력하세요"></textarea>
      <div class="row">
        <input id="at" type="datetime-local" aria-label="게시 시간" />
        <span id="count" class="count">0 / 500</span>
      </div>
      <div class="row">
        <button id="copy" class="btn primary" disabled>예약 항목 복사</button>
        <a class="btn" id="edit" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">queue.json 편집 열기</a>
      </div>
      <pre id="out" hidden></pre>
      <p class="hint">복사한 항목을 <code>posts/queue.json</code>의 <code>posts</code> 배열에 붙여 넣고 커밋하면 예약돼요. 시간은 한국 시간(KST) 기준이에요.</p>
    </section>

    <section class="card">
      <h2>예약 목록</h2>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-f="draft" aria-selected="false">초안</button>
        <button class="tab" role="tab" data-f="pending" aria-selected="true">대기</button>
        <button class="tab" role="tab" data-f="published" aria-selected="false">게시됨</button>
        <button class="tab" role="tab" data-f="failed" aria-selected="false">실패</button>
      </div>
      <ul id="list"><li class="empty">불러오는 중…</li></ul>
    </section>
  </main>

  <script>
    const REPO = "muse9306legend/myapp";
    const BRANCH = "main";
    const STATUS = { draft: "초안", pending: "대기", published: "게시됨", failed: "실패" };
    const $ = (id) => document.getElementById(id);
    let posts = [];
    let filter = "pending";

    $("edit").href = `https://github.com/${REPO}/edit/${BRANCH}/posts/queue.json`;

    const pad = (n) => String(n).padStart(2, "0");
    const d = new Date(Date.now() + 60 * 60 * 1000);
    $("at").value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;

    function entry() {
      return { at: `${$("at").value}:00+09:00`, text: $("text").value.trim(), status: "pending" };
    }

    function update() {
      const len = [...$("text").value.trim()].length;
      $("count").textContent = `${len} / 500`;
      $("count").classList.toggle("over", len > 500);
      $("copy").disabled = !len || len > 500 || !$("at").value;
      $("out").hidden = !len;
      $("out").textContent = JSON.stringify(entry(), null, 2) + ",";
    }
    $("text").addEventListener("input", update);
    $("at").addEventListener("input", update);

    $("copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("out").textContent);
        $("copy").textContent = "복사됨 ✓";
      } catch {
        $("copy").textContent = "복사 실패 – 아래 내용을 직접 복사하세요";
      }
      setTimeout(() => ($("copy").textContent = "예약 항목 복사"), 1800);
    });

    document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
      filter = t.dataset.f;
      document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === t)));
      render();
    }));

    const fmt = (iso) => new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" });

    function render() {
      const list = $("list");
      const items = posts.filter((p) => p.status === filter)
        .sort((a, b) => (filter === "pending" || filter === "draft" ? 1 : -1) * (Date.parse(a.at) - Date.parse(b.at)));
      list.replaceChildren();
      if (filter === "draft" && items.length) {
        const tip = document.createElement("li");
        tip.className = "empty";
        tip.textContent = "queue.json에서 status를 \"draft\" → \"pending\"으로 바꾸면 게시 예약돼요.";
        list.append(tip);
      }
      if (!items.length) {
        list.innerHTML = '<li class="empty">항목이 없어요.</li>';
        return;
      }
      for (const p of items) {
        const li = document.createElement("li");
        const meta = document.createElement("div");
        meta.className = "meta";
        const badge = document.createElement("span");
        badge.className = `badge ${p.status}`;
        badge.textContent = STATUS[p.status] || p.status;
        const when = document.createElement("span");
        when.textContent = fmt(p.published_at || p.at);
        meta.append(badge, when);
        if (p.permalink) {
          const a = document.createElement("a");
          a.href = p.permalink; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Threads에서 보기";
          a.style.color = "inherit";
          meta.append(a);
        }
        const text = document.createElement("div");
        text.className = "text";
        text.textContent = p.text;
        li.append(meta, text);
        if (p.error) {
          const e = document.createElement("div");
          e.className = "err";
          e.textContent = p.error;
          li.append(e);
        }
        list.append(li);
      }
    }

    fetch("./posts/queue.json", { cache: "no-store" })
      .then((r) => r.json())
      .then((q) => { posts = q.posts || []; render(); })
      .catch(() => { $("list").innerHTML = '<li class="empty">queue.json을 불러오지 못했어요.</li>'; });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  </script>
</body>
</html>
